<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouGlish components test</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:16px;
       background:#111a24;color:#e8eff7;line-height:1.5}
  h3{margin:0 0 4px;font-size:16px}
  p.hint{margin:0 0 12px;font-size:12.5px;color:#8fa8c0}
  .box{border:1px solid #23394f;border-radius:10px;margin:14px 0;overflow:hidden}
  .box .lbl{background:#1b2a3a;padding:8px 12px;font-size:13px;font-weight:600}
  .box .host{background:#0c1420}
  .box .dom{white-space:pre-wrap;font-size:11px;color:#9fb6cd;
            background:#0c1420;padding:8px 12px;border-top:1px solid #23394f}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  button{padding:10px 13px;border-radius:9px;border:1px solid #23394f;
         background:#1b2a3a;color:#e8eff7;font-size:14px}
  button:active{background:#254159}
  #status{font-size:12.5px;color:#8fa8c0;margin-top:6px}
</style>
</head>
<body>

<h3>YouGlish — so sánh components 0 / 1 / 8 / 9</h3>
<p class="hint">Bấm nút bên dưới, đợi vài giây cho từng khung load xong rồi <b>nhìn bằng mắt</b> khung nào KHÔNG có thanh tìm kiếm và KHÔNG có dòng caption. Chụp ảnh cả trang gửi lại.</p>

<div class="row">
  <button type="button" onclick="renderAll()">Dựng cả 4 khung để so sánh</button>
</div>
<div id="status">đang chờ widget.js…</div>

<div id="boxes"></div>

<script>
  var ygReady = false;
  var values = [0, 1, 8, 9];

  function onYouglishAPIReady(){
    ygReady = true;
    document.getElementById('status').textContent = '✓ widget.js sẵn sàng — bấm nút để dựng 4 khung';
  }

  function renderAll(){
    if(!ygReady){ document.getElementById('status').textContent = '✗ widget.js chưa sẵn sàng, đợi thêm'; return; }
    var wrap = document.getElementById('boxes');
    wrap.innerHTML = '';
    values.forEach(function(components, i){
      var id = 'yg-widget-c' + components;
      var box = document.createElement('div');
      box.className = 'box';
      box.innerHTML =
        '<div class="lbl">components = ' + components + '</div>' +
        '<div class="host"><div id="' + id + '"></div></div>' +
        '<div class="dom" id="dom-' + components + '">đang load…</div>';
      wrap.appendChild(box);

      try{
        var widget = new YG.Widget(id, {
          width: Math.min(document.body.clientWidth - 40, 640),
          components: components,
          events: {
            onFetchDone: function(){
              setTimeout(function(){ dumpInto(id, 'dom-' + components); }, 600);
            }
          }
        });
        widget.fetch('hello', 'english');
      }catch(e){
        document.getElementById('dom-' + components).textContent = 'LỖI: ' + (e && e.message ? e.message : e);
      }
    });
  }

  function dumpInto(hostId, domId){
    var host = document.getElementById(hostId);
    var container = host ? host.parentNode : null; // widget.js thay outerHTML của host
    var target = document.querySelector('#' + domId).previousElementSibling; // .host div
    var root = target ? target.firstElementChild : null;
    var out = [];
    (function walk(el, d){
      if(!el) return;
      for(var i = 0; i < el.children.length; i++){
        var c = el.children[i];
        var cls = (typeof c.className === 'string' && c.className) ? ' .' + c.className.trim().replace(/\s+/g, '.') : '';
        out.push(Array(d * 2 + 1).join(' ') + c.tagName.toLowerCase() + cls + '  h=' + c.offsetHeight);
        if(d < 4) walk(c, d + 1);
      }
    })(root, 0);
    document.getElementById(domId).textContent = out.join('\n') || '(rỗng)';
  }

  window.addEventListener('error', function(ev){
    document.getElementById('status').textContent = '✗ JS error: ' + ev.message;
  });
</script>

<script src="https://youglish.com/public/emb/widget.js" charset="utf-8"></script>

</body>
</html>
