<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouGlish components test</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:16px;
       background:#111a24;color:#e8eff7;line-height:1.5}
  h3{margin:0 0 4px;font-size:16px}
  p.hint{margin:0 0 12px;font-size:12.5px;color:#8fa8c0}
  #host{background:#1b2a3a;border-radius:10px;min-height:60px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  button{padding:10px 13px;border-radius:9px;border:1px solid #23394f;
         background:#1b2a3a;color:#e8eff7;font-size:14px}
  button:active{background:#254159}
  #log{white-space:pre-wrap;font-size:12px;background:#0c1420;color:#9fb6cd;
       padding:11px 12px;border-radius:10px;border:1px solid #23394f}
</style>
</head>
<body>

<h3>YouGlish — thử giá trị components</h3>
<p class="hint">Bấm từng nút để xem giá trị nào cho ra video mà không có thanh tìm kiếm và không có caption.</p>

<div id="host"></div>

<div class="row">
  <button type="button" onclick="render(0)">components 0</button>
  <button type="button" onclick="render(1)">1</button>
  <button type="button" onclick="render(8)">8</button>
  <button type="button" onclick="render(9)">9 (mặc định)</button>
</div>
<div class="row">
  <button type="button" onclick="dump()">In cấu trúc DOM</button>
  <button type="button" onclick="document.getElementById('log').textContent='log:'">Xoá log</button>
</div>

<div id="log">log:</div>

<script>
  var ygIdx = 0, widget = null, ygReady = false;

  function log(m){
    var el = document.getElementById('log');
    el.textContent += '\n' + m;
  }

  function onYouglishAPIReady(){
    ygReady = true;
    log('✓ widget.js sẵn sàng — đang dựng với components=9');
    render(9);
  }

  function render(components){
    if(!ygReady){ log('✗ widget.js chưa sẵn sàng'); return; }
    ygIdx++;
    var id = 'yg-widget-' + ygIdx;
    document.getElementById('host').innerHTML = '<div id="' + id + '"></div>';
    log('\n=== components=' + components + ' (id ' + id + ') ===');
    try{
      widget = new YG.Widget(id, {
        width: Math.min(document.body.clientWidth - 32, 640),
        components: components,
        events: {
          onFetchDone: function(e){ log('  onFetchDone — totalResult=' + (e ? e.totalResult : '?')); },
          onError:     function(e){ log('  onError từ YouGlish'); }
        }
      });
      widget.fetch('hello', 'english');
      log('  đã fetch("hello","english")');
    }catch(e){
      log('  ✗ THROW: ' + (e && e.message ? e.message : e));
    }
  }

  /* In ra cây DOM mà YouGlish dựng, kèm class và chiều cao —
     dùng để viết CSS chính xác nếu cần. */
  function dump(){
    var host = document.getElementById('host');
    var out = [];
    (function walk(el, d){
      for(var i = 0; i < el.children.length; i++){
        var c = el.children[i];
        var cls = (typeof c.className === 'string' && c.className) ? ' .' + c.className.trim().replace(/\s+/g, '.') : '';
        var sid = c.id ? ' #' + c.id : '';
        out.push(Array(d * 2 + 1).join(' ') + c.tagName.toLowerCase() + sid + cls + '  h=' + c.offsetHeight);
        if(d < 4) walk(c, d + 1);
      }
    })(host, 0);
    log('\n=== cấu trúc DOM ===\n' + (out.join('\n') || '(rỗng)'));
  }

  window.addEventListener('error', function(ev){
    log('✗ JS error: ' + ev.message);
  });
</script>

<script src="https://youglish.com/public/emb/widget.js" charset="utf-8"></script>

</body>
</html>
