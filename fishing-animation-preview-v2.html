<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focci fishing animation preview v2</title>
<style>
  body{background:#0e1b2a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui,sans-serif}
  .wrap{text-align:center}
  .fishing-scene{position:relative;width:260px;aspect-ratio:272/249;margin:0 auto;overflow:visible}
  .fish-frame{position:absolute;inset:0;opacity:0}
  .fish-frame img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 85%}
  .fish-frame svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .fish-line{fill:none;stroke:#5b4a3a;stroke-width:1.3;stroke-linecap:round;transform-box:fill-box}

  .f1{animation:ff1 9s steps(1) infinite}
  .f2{animation:ff2 9s steps(1) infinite}
  .f3{animation:ff3 9s steps(1) infinite}
  .f4{animation:ff4 9s steps(1) infinite}
  @keyframes ff1{0%{opacity:1}17%{opacity:1}17.1%{opacity:0}100%{opacity:0}}
  @keyframes ff2{17%{opacity:0}17.1%{opacity:1}55%{opacity:1}55.1%{opacity:0}100%{opacity:0}}
  @keyframes ff3{55%{opacity:0}55.1%{opacity:1}68%{opacity:1}68.1%{opacity:0}100%{opacity:0}}
  @keyframes ff4{68%{opacity:0}68.1%{opacity:1}95%{opacity:1}95.1%{opacity:0}100%{opacity:0}}

  /* idle breathing — a very small scale/lift pulse on the fox itself, separate from the line sway */
  .breathe-1{animation:breathe 3.2s ease-in-out infinite}
  .breathe-2{animation:breathe 4s ease-in-out infinite}
  .breathe-4{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.012)}}
  /* frame 3 gets a quick startled jolt instead of a calm breath */
  .jolt{animation:jolt .5s ease-in-out infinite}
  @keyframes jolt{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-1deg)}60%{transform:translateY(0) rotate(1deg)}}

  .line-1{animation:sway-a 2.6s ease-in-out infinite}
  .line-2{animation:sway-b 3.4s ease-in-out infinite}
  .line-3{animation:sway-tense .35s ease-in-out infinite alternate}
  .line-4{animation:sway-a 2.8s ease-in-out infinite}
  @keyframes sway-a{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes sway-b{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes sway-tense{0%{transform:rotate(-1.2deg)}100%{transform:rotate(1.2deg)}}

  /* water ripple — visible shimmering bands tinted to the sampled pond colour */
  .water-ripple{position:absolute;left:4%;right:6%;bottom:4%;height:24%;pointer-events:none;
    overflow:hidden;border-radius:0 0 40% 40%/0 0 18% 18%}
  .water-ripple i{position:absolute;left:-20%;right:-20%;height:9px;border-radius:50%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    opacity:.65;animation:ripple-drift linear infinite}
  .water-ripple i:nth-child(1){bottom:6%;animation-duration:2.6s}
  .water-ripple i:nth-child(2){bottom:38%;animation-duration:3.4s;animation-delay:-1s;opacity:.5}
  .water-ripple i:nth-child(3){bottom:68%;animation-duration:2.9s;animation-delay:-.4s;opacity:.4}
  @keyframes ripple-drift{0%{transform:translateX(-15%) scaleX(.85)}50%{transform:translateX(15%) scaleX(1.15)}100%{transform:translateX(-15%) scaleX(.85)}}

  .lbl{color:#9fb3c8;font-size:12px;margin-top:14px}
</style></head>
